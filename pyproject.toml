[project]
name = "care-task-agent"
version = "0.1.0"
description = "An ADK agent that answers a care-team task by calling FHIR tools exposed by a FastMCP server."
readme = "README.md"
license = "MIT"
authors = [{ name = "Steven Pequeno" }]
requires-python = ">=3.12"

# The testable core stays dependency-light on purpose: `just verify` runs offline,
# without a model and without the cloud. The agent runtime (ADK, FastMCP, FastAPI,
# Vertex) is the `runtime` extra — it is the deploy half, verified separately.
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
runtime = [
    "google-adk>=2.12",
    "fastmcp>=4.1",
    "google-genai>=2.31",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/care_task_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
